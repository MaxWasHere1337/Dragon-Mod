name: Release

# Changing the VERSION file publishes a GitHub release with that name and
# DragonMod.mcaddon attached. Names containing "alpha" or "beta" are marked
# as pre-releases.
on:
  push:
    paths: [ "VERSION" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python tools/build.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(tr -d '[:space:]' < VERSION)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do."
            exit 0
          fi
          flags=""
          case "$tag" in *alpha*|*beta*) flags="--prerelease" ;; esac
          gh release create "$tag" dist/DragonMod.mcaddon \
            --target "$GITHUB_SHA" \
            --title "Dragon Mod $tag" \
            --notes-file RELEASE_NOTES.md $flags
