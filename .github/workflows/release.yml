name: Release

# Pushing a tag like v0.1.0-alpha builds the add-on and publishes it as a
# GitHub release with DragonMod.mcaddon attached.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python tools/build.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *alpha*|*beta*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/DragonMod.mcaddon \
            --title "Dragon Mod $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md $flags
